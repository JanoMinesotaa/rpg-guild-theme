name: Dzienny raport zmian

# JEDEN cron, bez bramki godzinowej. Poprzednia wersja miala dwa crony
# (06:00 i 07:00 UTC) i wysylala tylko wtedy, gdy lokalna godzina wynosila 8.
# To nie zadzialalo ani razu: harmonogram GitHuba jest best-effort i 23.09
# odpalil zadania dopiero o 12:00 i 14:00 czasu polskiego, wiec bramka zdusila
# obie wysylki. Lepiej wyslac raport z opoznieniem niz nie wyslac go wcale.
#
# 06:07 UTC to 08:07 latem (CEST) i 07:07 zima (CET). Minuta celowo nie jest
# rowna - o pelnych godzinach kolejka GitHuba jest najdluzsza.
on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:       # mozliwosc odpalenia recznie, do testu

jobs:
  raport:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Warsaw
    steps:
      - name: Pobierz repo z pelna historia
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # bez tego git log nie widzi historii

      - name: Pokaz, o ktorej naprawde wystartowalo
        run: |
          echo "Lokalna godzina (Europe/Warsaw): $(date '+%H:%M')"
          echo "Harmonogram GitHuba jest best-effort - opoznienie jest normalne."

      - name: Zbierz zmiany i wyslij maila
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
        run: python3 .github/scripts/dziennik_maila.py
