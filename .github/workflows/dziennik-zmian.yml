name: Dzienny raport zmian

# GitHub Actions zna tylko UTC, a 8:00 w Polsce to 06:00 UTC latem (CEST)
# i 07:00 UTC zima (CET). Dlatego workflow odpala sie DWA RAZY, a wysylka
# jest bramkowana sprawdzeniem lokalnej godziny w strefie Europe/Warsaw.
# Dzieki temu mail wychodzi o 8:00 czasu polskiego przez caly rok, raz dziennie.
on:
  schedule:
    - cron: "0 6 * * *"   # 08:00 CEST (lato)
    - cron: "0 7 * * *"   # 08:00 CET  (zima)
  workflow_dispatch:       # mozliwosc odpalenia recznie, do testu

jobs:
  raport:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Warsaw
    steps:
      - name: Pobierz repo z pelna historia
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # bez tego git log nie widzi historii

      - name: Sprawdz, czy to wlasciwa godzina lokalna
        id: brama
        run: |
          GODZINA=$(date +%H)
          echo "Lokalna godzina (Europe/Warsaw): $GODZINA"
          if [ "$GODZINA" = "08" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "wysylac=tak" >> "$GITHUB_OUTPUT"
          else
            echo "wysylac=nie" >> "$GITHUB_OUTPUT"
            echo "To drugie z dwoch uruchomien - pomijam, zeby nie wyslac dwoch maili."
          fi

      - name: Zbierz zmiany i wyslij maila
        if: steps.brama.outputs.wysylac == 'tak'
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_CC: ${{ secrets.MAIL_CC }}
        run: python3 .github/scripts/dziennik_maila.py
